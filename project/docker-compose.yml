services:
  db:
    image: postgres:17-alpine
    container_name: university-tickets-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: university_tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d university_tickets"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: university-tickets-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/university_tickets

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
